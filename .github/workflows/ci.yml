name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # The registry's own contracts, run BESIDE rig template-lint and never
  # inside it: rig owns its schema, and it must not learn one registry's
  # conventions. Its own job so a base divergence is legible without reading
  # a converge log.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: the agent tenants' shared APT_EXTRAS base
        run: bash test/agent-apt-extras.test.sh
      - name: labels.conf sets documented in CONTRIBUTING.md
        run: bash test/labels-conf-documented.test.sh
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: registry smoke drill
        run: bash drill/drill.sh --record - --yes
      # --strict because this leg IS the evidence: a SKIPPED crew leg on a
      # runner that has docker is as much a non-answer as a FAIL.
      - name: crew-member drill — a converged tenant survives crew hire
        run: bash drill/drill.sh --role codex-box --crew-member --record - --yes --strict
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog diff guards fail closed when the merge base cannot
          # be resolved; full history keeps that proof available on fork PRs.
          fetch-depth: 0
      # Third-party actions must resolve to immutable commits; heavy-duty's
      # first-party ceremony callers keep the repository's single release pin.
      - uses: heavy-duty/ceremony/actions/changelog-armed@0.7.7
      - uses: heavy-duty/ceremony/actions/changelog-monotonic@0.7.7
      - uses: heavy-duty/ceremony/actions/changelog-assembled@0.7.7
      - uses: heavy-duty/ceremony/actions/drill-recorded@0.7.7
      - uses: heavy-duty/ceremony/actions/runner-isolated@0.7.7
      - uses: heavy-duty/ceremony/actions/docs-sync@0.7.7
      - uses: heavy-duty/ceremony/actions/sha-pinned@0.7.7
      # rig owns the schema: the lint ships beside the mint-time parser that
      # enforces it, so the two cannot drift. Fetched at main — the lint is a
      # dev-time gate; what a MINT parses with is the rig it runs.
      - name: fetch rig (the lint lives with the mechanism)
        run: curl -fsSL https://github.com/heavy-duty/rig/archive/refs/heads/main.tar.gz | tar -xz
      - name: rig template-lint — every definition, every PR
        run: |
          shopt -s nullglob
          dirs=(*-box/ *-server/)
          # workstation is the one intentional suffix-less machine role.
          [[ -d workstation ]] && dirs+=(workstation/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no role definitions found — an empty registry is a broken registry" >&2
            exit 1
          fi
          bash rig-main/bin/rig template-lint "${dirs[@]}"
